description: >-
  ATSDR protects communities from harmful health effects related to exposure to natural and man-made hazardous
  substances. It is a federal public health agency within the U.S. Department of Health and Human Services. ATSDR
  provides toxicological profiles, minimum risk levels, substance priority rankings, and exposure investigation data for
  hazardous chemicals.
